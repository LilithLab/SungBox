name: Release APK (arm64-v8a)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-37.1" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Fetch libbox.aar (sing-box v1.14.2)
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 --retry-delay 5 -o app/libs/libbox.aar \
            "https://jitpack.io/com/github/singbox-android/libbox/1.14.2/libbox-1.14.2.aar"
          echo "c17ee8db872e767de88629f232065feec3dec4bd4a098e468fa4accadc8003ae  app/libs/libbox.aar" | sha256sum -c -

      - name: Import signing keystore (from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing repository secret KEYSTORE_BASE64"; exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build signed release APK (arm64-v8a)
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -z "${LOCAL_PROPERTIES:-}" ]; then
            echo "::error::Missing repository secret LOCAL_PROPERTIES"; exit 1
          fi
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease -PsungboxAbiOnly=arm64-v8a --no-daemon --stacktrace

      - name: Verify signature & checksum
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/other/release/*arm64*.apk | head -1)"
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          echo "---- sha256 ----"
          cat "$(dirname "$APK")/$(basename "$APK").sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SungBox-arm64-release
          path: |
            app/build/outputs/apk/other/release/*.apk
            app/build/outputs/apk/other/release/*.sha256

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            app/build/outputs/apk/other/release/*.apk
            app/build/outputs/apk/other/release/*.sha256
